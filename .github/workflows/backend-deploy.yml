name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main, claude/scheduling-optimizer-setup-wcrh8t, claude/legacy-ui-mockup, claude/frontend-modernization]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-scheduling-optimizer
  ACR_NAME: acrschedulingopt
  CONTAINER_APP_NAME: ca-scheduling-backend
  IMAGE_NAME: scheduling-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image via ACR Tasks
        run: |
          IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            ./backend
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-name ${{ env.CONTAINER_APP_NAME }} \
            --image "${{ env.IMAGE_TAG }}"

      - name: Azure Logout
        if: always()
        run: az logout
